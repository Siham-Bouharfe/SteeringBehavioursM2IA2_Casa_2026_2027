<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steering Lab — Seek &amp; Flee</title>
    <link rel="stylesheet" href="style.css">
    <script src="libraries/p5.min.js"></script>
    <script src="settings.js"></script>
    <script src="music.js"></script>
    <script src="vehicle.js"></script>
    <script src="FleeVehicle.js"></script>
    <script src="population.js"></script>
    <script src="target.js"></script>
    <script src="cibleFuyante.js"></script>
    <script src="leurre.js"></script>
    <script src="targetCollisions.js"></script>
    <script src="confetti.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <div id="controls">
      <header class="topbar">
        <div class="brand">
          <span class="brand-kicker">STEERING LAB</span>
          <h1>Seek <span>&amp;</span> Flee</h1>
        </div>
        <div class="top-actions">
          <label class="scenario-picker" for="scenario">
            <span>SCÉNARIO</span>
            <select id="scenario">
              <option value="seek">01 · Poursuite</option>
              <option value="flee">02 · Fuite</option>
            </select>
          </label>
          <button id="music-toggle" type="button">Activer la musique</button>
          <output id="audio-status" aria-live="polite">Audio désactivé</output>
          <button id="settings-toggle" class="settings-toggle" type="button"
            aria-expanded="false" aria-controls="simulation-menu">Réglages <span>⌄</span></button>
        </div>
      </header>
      <div id="simulation-menu" class="settings-panel" hidden>
        <section class="control-group">
          <h2>Population</h2>
          <label for="vehicle-count">Véhicules <output id="vehicle-count-value" for="vehicle-count">20 / 200</output></label>
          <input id="vehicle-count" type="range" min="1" max="200" step="1" value="20">
          <label for="target-count">Cibles <output id="target-count-value">2</output></label>
          <input id="target-count" type="range" min="1" max="10" step="1" value="2">
          <label for="detection-radius">Détection <output id="detection-radius-value">200 px</output></label>
          <input id="detection-radius" type="range" min="50" max="300" step="10" value="200">
        </section>
        <section class="control-group">
          <h2>Mouvement</h2>
          <label for="max-speed">Vitesse max <output id="max-speed-value">4</output></label>
          <input id="max-speed" type="range" min="0" max="20" step="0.5" value="4">
          <label for="max-force">Force max <output id="max-force-value">0.2</output></label>
          <input id="max-force" type="range" min="0" max="10" step="0.1" value="0.2">
        </section>
        <section class="control-group">
          <h2>Ambiance</h2>
          <label for="gradient-speed">Mouvement du fond <output id="gradient-speed-value">1</output></label>
          <input id="gradient-speed" type="range" min="0" max="3" step="0.1" value="1">
          <label for="gradient-intensity">Intensité <output id="gradient-intensity-value">1</output></label>
          <input id="gradient-intensity" type="range" min="0.2" max="2" step="0.1" value="1">
          <p class="hint">En scénario Fuite, appuie sur <kbd>D</kbd> pour afficher le rayon : jaune si libre, rouge si un véhicule est détecté.</p>
        </section>
      </div>
    </div>
    <main id="scene" aria-label="Simulation interactive de poursuite et de fuite"></main>
  </body>
</html>
